name: quality

on:
  push:
  pull_request:

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project environment
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Public configuration tests
        run: python -m pytest -q -p no:cacheprovider rl/af/tests/test_public_configs.py

